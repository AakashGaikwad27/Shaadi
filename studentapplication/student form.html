<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Application Form</title>
</head>

<body>

<center>
    <h1>🎓 Student Application Form</h1>
    <p>Please fill in the details below to complete your application.</p>
</center>

<hr>

<form action="details.html" method="get">

    <h3>Personal Details</h3>

    <label for="name">1. Full Name</label><br><br>
    <input type="text" id="name" name="name"
           placeholder="Your answer" required>
    <br><br><br>

    <label for="email">2. Email Address</label><br><br>
    <input type="email" id="email" name="email"
           placeholder="Your email" required>
    <br><br><br>

    <label for="phone">3. Phone Number</label><br><br>
    <input type="tel" id="phone" name="phone"
           placeholder="10-digit mobile number"
           pattern="[0-9]{10}" required>
    <br><br><br>

    <label for="dob">4. Date of Birth</label><br><br>
    <input type="date" id="dob" name="dob" required>
    <br><br><br>

    <label>5. Gender</label><br><br>

    <input type="radio" id="male" name="gender"
           value="Male" required>
    <label for="male">Male</label>
    <br>

    <input type="radio" id="female" name="gender"
           value="Female">
    <label for="female">Female</label>
    <br>

    <input type="radio" id="other" name="gender"
           value="Other">
    <label for="other">Other</label>

    <br><br><br>

    <hr>

    <h3>Academic Details</h3>

    <label for="enrollment">6. Enrollment Number</label><br><br>
    <input type="text" id="enrollment" name="enrollment"
           placeholder="Your answer" required>
    <br><br><br>

    <label for="course">7. Select Your Course</label><br><br>

    <select id="course" name="course" required>
        <option value="">Choose your course</option>
        <option value="B.Tech">B.Tech</option>
        <option value="B.Sc">B.Sc</option>
        <option value="B.Com">B.Com</option>
        <option value="BBA">BBA</option>
        <option value="BCA">BCA</option>
        <option value="MBA">MBA</option>
        <option value="MCA">MCA</option>
        <option value="Diploma">Diploma</option>
        <option value="Other">Other</option>
    </select>

    <br><br><br>

    <label for="department">8. Department</label><br><br>

    <select id="department" name="department" required>
        <option value="">Choose your department</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Artificial Intelligence and Machine Learning">
            Artificial Intelligence and Machine Learning
        </option>
        <option value="Electronics">Electronics</option>
        <option value="Electrical">Electrical</option>
        <option value="Mechanical">Mechanical</option>
        <option value="Civil">Civil</option>
        <option value="Other">Other</option>
    </select>

    <br><br><br>

    <label>9. Current Academic Year</label><br><br>

    <input type="radio" id="year1" name="year"
           value="1st Year" required>
    <label for="year1">1st Year</label>
    <br>

    <input type="radio" id="year2" name="year"
           value="2nd Year">
    <label for="year2">2nd Year</label>
    <br>

    <input type="radio" id="year3" name="year"
           value="3rd Year">
    <label for="year3">3rd Year</label>
    <br>

    <input type="radio" id="year4" name="year"
           value="4th Year">
    <label for="year4">4th Year</label>

    <br><br><br>

    <label for="college">10. College Name</label><br><br>
    <input type="text" id="college" name="college"
           placeholder="Your answer" required>
    <br><br><br>

    <hr>

    <h3>Additional Information</h3>

    <label for="city">11. City</label><br><br>
    <input type="text" id="city" name="city"
           placeholder="Your answer" required>
    <br><br><br>

    <label for="reason">
        12. Why do you want to join this course?
    </label>
    <br><br>

    <textarea id="reason" name="reason" rows="4" cols="35"
              placeholder="Write your answer here"></textarea>

    <br><br><br>

    <input type="checkbox" id="declaration"
           name="declaration" value="Confirmed" required>

    <label for="declaration">
        I confirm that the information provided is correct.
    </label>

    <br><br><br>

    <input type="submit" value="Submit Application">
    <input type="reset" value="Clear Form">

</form>

<hr>

<center>
    <p>Thank you for applying! 😊</p>
</center>

</body>

</html>
